# Thin caller of the shared CTTIR R CMD check workflow, pinned to the
# reviewed shared workflow commit.
# Do not add steps here and do not switch the ref to a branch; an update of
# the pin needs a source and contract review first.
#
# Java protocol/core checks have a separate bridge-core.yaml workflow.
# Native QuPath, browser and second-machine lanes are not covered here;
# their local validation remains available through tools/validate.R.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: R-CMD-check

# The shared workflow only reads repository contents.
permissions:
  contents: read

jobs:
  check:
    uses: CTTIR/.github/.github/workflows/R-CMD-check.yaml@cbf3c61d7cbae6b15c15bf917a36da41988c7a5f
