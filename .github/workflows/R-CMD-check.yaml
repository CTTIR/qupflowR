# Thin caller of the shared CTTIR R CMD check workflow, pinned to the
# reviewed commit named in the build kit (docs/20_CTTIR_STANDARDS.md).
# Do not add steps here and do not switch the ref to a branch; an update of
# the pin needs a source and contract review first.
#
# The Java bridge (tools/bridge), QuPath, browser and second-machine lanes
# are not covered by this workflow; they are run locally through
# tools/validate.R until dedicated jobs exist.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: R-CMD-check

# The called workflow declares `permissions: read-all`. A reusable workflow
# can only keep or reduce the caller's token permissions, so read-all is the
# narrowest grant that lets it run. Nothing here needs write access.
permissions: read-all

jobs:
  check:
    uses: CTTIR/.github/.github/workflows/R-CMD-check.yaml@d54cd50b95ba0110dcc54e6371e3ebb82ee94afb
