# Coordinates shared by all bridge modules (BLUEPRINT section 1).
group=io.github.cttir.qupflowr
version=0.1.0-SNAPSHOT

# Protocol version served by this bridge; checked against ProtocolVersion.CURRENT by a unit test.
qupflowr.protocolVersion=1.0

# Never download JDKs implicitly: the Java 25 toolchain must already exist (dev: .tools/jdk-25).
org.gradle.java.installations.auto-download=false

# Dependency verification (gradle/verification-metadata.xml) is always enforced.
org.gradle.dependency.verification=strict

org.gradle.console=plain
org.gradle.warning.mode=all
