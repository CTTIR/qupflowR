<svg width="500" height="580" viewBox="0 0 500 580" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgqup" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%"  stop-color="#0a1626"/>
      <stop offset="100%" stop-color="#050c16"/>
    </linearGradient>
    <!-- Cup body -->
    <linearGradient id="cupBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3B82F6"/>
      <stop offset="45%"  stop-color="#1D6FD8"/>
      <stop offset="55%"  stop-color="#155CB8"/>
      <stop offset="100%" stop-color="#0E4488"/>
    </linearGradient>
    <!-- Liquid surface -->
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7FB2F5"/>
      <stop offset="100%" stop-color="#2E6FC0"/>
    </linearGradient>
    <!-- Flow / steam ribbon -->
    <linearGradient id="flowRibbon" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#42A5F5" stop-opacity="0.15"/>
      <stop offset="50%"  stop-color="#7FC8F0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#B3E0FF" stop-opacity="0.7"/>
    </linearGradient>
    <clipPath id="hexqup">
      <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"/>
    </clipPath>
  </defs>

  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145" fill="url(#bgqup)"/>

  <g clip-path="url(#hexqup)">

    <!-- faint grid -->
    <line x1="45" y1="220" x2="455" y2="220" stroke="#12385f" stroke-width="0.4" opacity="0.35"/>
    <line x1="45" y1="290" x2="455" y2="290" stroke="#12385f" stroke-width="0.4" opacity="0.35"/>
    <line x1="45" y1="360" x2="455" y2="360" stroke="#12385f" stroke-width="0.4" opacity="0.35"/>
    <line x1="150" y1="145" x2="150" y2="490" stroke="#12385f" stroke-width="0.4" opacity="0.3"/>
    <line x1="250" y1="145" x2="250" y2="490" stroke="#12385f" stroke-width="0.4" opacity="0.3"/>
    <line x1="350" y1="145" x2="350" y2="490" stroke="#12385f" stroke-width="0.4" opacity="0.3"/>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FLOW RIBBONS — the "flow": workflow steps rising as     -->
    <!-- steam, each a qp_* stage node on the way up             -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- left ribbon -->
    <path d="M 224,300 C 210,270 240,250 224,220 C 210,192 236,172 226,150"
      fill="none" stroke="url(#flowRibbon)" stroke-width="5" opacity="0.8" stroke-linecap="round"/>
    <!-- right ribbon -->
    <path d="M 276,300 C 290,270 260,250 276,220 C 290,192 264,172 274,150"
      fill="none" stroke="url(#flowRibbon)" stroke-width="5" opacity="0.8" stroke-linecap="round"/>
    <!-- centre ribbon -->
    <path d="M 250,302 C 244,268 256,244 250,210 C 244,182 256,166 250,150"
      fill="none" stroke="url(#flowRibbon)" stroke-width="4" opacity="0.6" stroke-linecap="round"/>

    <!-- workflow stage nodes along the flow (qp_* steps) -->
    <circle cx="224" cy="250" r="3.5" fill="#B3E0FF" opacity="0.85"/>
    <circle cx="276" cy="250" r="3.5" fill="#B3E0FF" opacity="0.85"/>
    <circle cx="250" cy="230" r="3"   fill="#7FC8F0" opacity="0.7"/>
    <circle cx="226" cy="195" r="3"   fill="#B3E0FF" opacity="0.7"/>
    <circle cx="274" cy="195" r="3"   fill="#B3E0FF" opacity="0.7"/>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FLOWER — rising out of the cup on a stem (the "flower") -->
    <!-- Petals coloured like a QuPath detection overlay          -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- stem -->
    <path d="M 250,300 C 248,260 252,220 250,186"
      fill="none" stroke="#2E7D32" stroke-width="3" opacity="0.9" stroke-linecap="round"/>
    <!-- leaf left -->
    <path d="M 250,246 C 232,238 222,248 226,262 C 240,262 250,256 250,246 Z"
      fill="#2E7D32" opacity="0.85"/>
    <!-- leaf right -->
    <path d="M 250,224 C 268,216 280,226 275,240 C 261,240 250,234 250,224 Z"
      fill="#3A9D42" opacity="0.85"/>

    <!-- flower head at top — 6 petals -->
    <g transform="translate(250,168)">
      <ellipse cx="0" cy="-16" rx="7" ry="13" fill="#E5397D" opacity="0.9" transform="rotate(0)"/>
      <ellipse cx="0" cy="-16" rx="7" ry="13" fill="#E5397D" opacity="0.9" transform="rotate(60)"/>
      <ellipse cx="0" cy="-16" rx="7" ry="13" fill="#E5397D" opacity="0.9" transform="rotate(120)"/>
      <ellipse cx="0" cy="-16" rx="7" ry="13" fill="#F06292" opacity="0.9" transform="rotate(180)"/>
      <ellipse cx="0" cy="-16" rx="7" ry="13" fill="#F06292" opacity="0.9" transform="rotate(240)"/>
      <ellipse cx="0" cy="-16" rx="7" ry="13" fill="#F06292" opacity="0.9" transform="rotate(300)"/>
      <!-- flower centre -->
      <circle cx="0" cy="0" r="8" fill="#FFC107"/>
      <circle cx="0" cy="0" r="4" fill="#FF8F00"/>
    </g>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- CUP — the "cup", holds the flow                         -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- saucer -->
    <ellipse cx="250" cy="392" rx="96" ry="16" fill="#0E4488" opacity="0.9"/>
    <ellipse cx="250" cy="390" rx="96" ry="15" fill="#155CB8" opacity="0.95"/>
    <ellipse cx="250" cy="388" rx="70" ry="9"  fill="#0a1626" opacity="0.7"/>

    <!-- cup body (tapered) -->
    <path d="M 186,302 L 314,302 L 300,372 Q 298,382 288,383 L 212,383 Q 202,382 200,372 Z"
      fill="url(#cupBody)" stroke="#7FB2F5" stroke-width="2" stroke-linejoin="round"/>

    <!-- liquid surface ellipse at rim -->
    <ellipse cx="250" cy="302" rx="64" ry="12" fill="url(#liquid)" stroke="#B3E0FF" stroke-width="1.5"/>
    <!-- inner rim shadow -->
    <ellipse cx="250" cy="302" rx="64" ry="12" fill="none" stroke="#0E4488" stroke-width="0.8" opacity="0.5"/>

    <!-- handle -->
    <path d="M 314,318 C 348,314 350,356 312,358"
      fill="none" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
    <path d="M 314,318 C 348,314 350,356 312,358"
      fill="none" stroke="#7FB2F5" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- QuPath-style detection dots on liquid surface (tiny) -->
    <circle cx="232" cy="300" r="2" fill="#FFC107" opacity="0.7"/>
    <circle cx="258" cy="304" r="2" fill="#E5397D" opacity="0.7"/>
    <circle cx="270" cy="299" r="1.6" fill="#3A9D42" opacity="0.7"/>
    <circle cx="242" cy="305" r="1.6" fill="#B3E0FF" opacity="0.7"/>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Workflow annotation                                     -->
    <!-- ══════════════════════════════════════════════════════ -->
    <text font-family="monospace" font-size="8" fill="#7FC8F0" opacity="0.6"
      text-anchor="middle" x="250" y="418">qp_workflow_run()</text>

  </g>

  <!-- Hex border — imaging blue -->
  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"
    fill="none" stroke="#185FA5" stroke-width="11" stroke-linejoin="round"/>
  <polygon points="250,44 441,153 441,367 250,476 59,367 59,153"
    fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round" opacity="0.55"/>

  <!-- Package name -->
  <text font-family="monospace" font-weight="700" font-size="26"
    fill="#90C8F5" text-anchor="middle" x="250" y="545" letter-spacing="0.5">qupflowR</text>
</svg>
